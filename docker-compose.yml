version: "3.9"
services:
  web:
    image: amony550/web-store:latest
    ports:
      - "3000:3000"
    env_file:
        - .env
    command: ["pnpm", "dev"]
    depends_on:
      - mysql
    restart: always
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kd5f
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3308:3306"
    restart: always
volumes:
  mysql_data:
