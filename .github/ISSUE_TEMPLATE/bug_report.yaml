name: Bug Report
description: Report a bug to help us improve KD5F Digital Game Store
title: "[BUG] <short description>"
labels: [ "bug" ]
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report a bug. Please fill in as much detail as possible so we can reproduce and fix it quickly.

- type: textarea
  id: bug-description
  attributes:
    label: Bug Description
    description: A clear and concise description of what the bug is.
    placeholder: Describe the bug...
  validations:
    required: true

- type: dropdown
  id: affected-role
  attributes:
    label: Affected Role
    description: Which user role is affected by this bug?
    options:
    - Buyer
    - Seller
    - Both
    - Not role-specific (e.g. login, registration, home page)
  validations:
    required: true

- type: input
  id: affected-page
  attributes:
    label: Affected Feature / Page
    description: Which page or feature does this bug occur on?
    placeholder: "e.g. Shopping Cart, Checkout, Seller Dashboard, Product Management"
  validations:
    required: true

- type: textarea
  id: steps-to-reproduce
  attributes:
    label: Steps to Reproduce
    description: Step-by-step instructions to trigger the bug.
    placeholder: |
      1. Go to '...'
      2. Click on '...'
      3. Enter '...'
      4. See error
  validations:
    required: true

- type: textarea
  id: expected-behavior
  attributes:
    label: Expected Behavior
    description: What did you expect to happen?
    placeholder: Describe what should have happened...
  validations:
    required: true

- type: textarea
  id: actual-behavior
  attributes:
    label: Actual Behavior
    description: What actually happened? Include any error messages shown on screen.
    placeholder: Describe what actually happened...
  validations:
    required: true

- type: textarea
  id: screenshots
  attributes:
    label: Screenshots / Screen Recording
    description: If applicable, attach screenshots or a screen recording to help explain the problem.
    placeholder: Drag and drop images here or paste a link...

- type: dropdown
  id: browser
  attributes:
    label: Browser
    description: Which browser did you use when encountering this bug?
    options:
    - Chrome
    - Firefox
    - Safari
    - Microsoft Edge
    - Other
  validations:
    required: true

- type: dropdown
  id: os
  attributes:
    label: Operating System
    options:
    - Windows 11
    - Windows 10
    - macOS
    - Linux
    - iOS (mobile)
    - Android (mobile)
    - Other
  validations:
    required: true

- type: input
  id: node-version
  attributes:
    label: Node.js Version
    description: Run `node -v` in your terminal and paste the result.
    placeholder: "e.g. v20.11.0"

- type: textarea
  id: console-errors
  attributes:
    label: Console Errors
    description: Paste any errors from the browser console (F12 > Console) or the server terminal.
    render: shell
    placeholder: "(paste errors here)"

- type: textarea
  id: additional-context
  attributes:
    label: Additional Context
    description: Any other context about the problem, such as when it started or if it happens intermittently.
    placeholder: Add any other context here...
