name: Feature Request
description: Suggest a new feature or enhancement for KD5F Digital Game Store
title: "[FEATURE] <short description>"
labels: [ "enhancement" ]
body:
- type: markdown
  attributes:
    value: |
      Have an idea to make KD5F better? Fill in the details below to help us understand your request.

- type: dropdown
  id: affected-role
  attributes:
    label: Target Role
    description: Who would benefit from this feature?
    options:
    - Buyer
    - Seller
    - Both
    - General / Not role-specific
  validations:
    required: true

- type: input
  id: related-page
  attributes:
    label: Related Feature / Page
    description: Which existing page or feature area does this relate to, if any?
    placeholder: "e.g. Wishlist, Seller Dashboard, Search, Checkout"

- type: textarea
  id: problem
  attributes:
    label: Problem Statement
    description: Is your feature request related to a problem? Describe it clearly.
    placeholder: "e.g. As a buyer, I find it frustrating that I cannot filter products by genre..."
  validations:
    required: true

- type: textarea
  id: proposed-solution
  attributes:
    label: Proposed Solution
    description: Describe the feature or change you would like to see.
    placeholder: Describe your idea in detail...
  validations:
    required: true

- type: textarea
  id: alternatives
  attributes:
    label: Alternatives Considered
    description: Have you considered any alternative solutions or workarounds?
    placeholder: Describe any alternatives you've thought of...

- type: dropdown
  id: priority
  attributes:
    label: Priority
    description: How important is this feature to you?
    options:
    - Low - Nice to have
    - Medium - Would improve the experience
    - High - Important for core functionality
    - Critical - Blocking usage
  validations:
    required: true

- type: textarea
  id: mockups
  attributes:
    label: Mockups / References
    description: Attach any wireframes, sketches, or links to similar features for reference.
    placeholder: Drag and drop images here or paste a link...

- type: textarea
  id: additional-context
  attributes:
    label: Additional Context
    description: Any other context or information about the feature request.
    placeholder: Add any other context here...
