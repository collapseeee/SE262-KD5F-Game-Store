name: Deploy to AWS

on:
  push:
    branches:
      - main
      - release/*

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # login docker hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      #  build + push
      - name: Build and Push Docker Image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/web-store:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      # push docker-compose (main)
      - name: Push compose to Main
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_NAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      # push docker-compose (release)
      - name: Push compose to RELEASE
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_NAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      # deploy PROD
      - name: Deploy to MAIN
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_NAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu

            IMAGE=${{ secrets.DOCKER_USERNAME }}/web-store:${{ github.sha }}

            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}

            docker compose pull
            docker compose up -d --remove-orphans

      # deploy STAGING
      - name: Deploy to RELEASE
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_RELEASE_HOST }}
          username: ${{ secrets.SSH_NAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu

            IMAGE=${{ secrets.DOCKER_USERNAME }}/web-store:${{ github.sha }}

            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}

            docker compose pull
            docker compose up -d --remove-orphans
