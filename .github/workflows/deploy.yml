name: Deploy to VM

on:
  push:
    branches: [ "production" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    #  login docker hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    #  build + push image
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/web-store:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/web-store:latest

    #  deploy 
    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_NAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/ubuntu/app
          docker compose pull
          docker compose down -v
          docker compose up -d
